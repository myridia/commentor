name: Build macOS Release

on:
  push:
    branches: ["main"]
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: read
  packages: none

jobs:
  build_macos_intel:
    if: github.repository_owner == 'myridia'
    runs-on: macos-13
    steps:
      - name: Install Rust
        run: brew install rust rustc-completion

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Add target
        run: |
          rustup target list
          rustup target add x86_64-apple-darwin

      - name: Compile macOS Intel
        run: cargo build --target x86_64-apple-darwin --release

      - name: Rename binary
        run: cp target/x86_64-apple-darwin/release/commentor target/x86_64-apple-darwin/release/commentor_macos_intel

      - name: Upload macOS Intel binary
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: target/x86_64-apple-darwin/release/commentor_macos_intel
          tag: ${{ github.ref }}
          overwrite: true
          file_glob: true

  build_macos_silicon:
    if: github.repository_owner == 'myridia'
    runs-on: macos-14
    steps:
      - name: Install Rust
        run: brew install rust rustc-completion

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Add target
        run: |
          rustup target list
          rustup target add aarch64-apple-darwin

      - name: Compile macOS Silicon
        run: cargo build --target aarch64-apple-darwin --release

      - name: Rename binary
        run: cp target/aarch64-apple-darwin/release/commentor target/aarch64-apple-darwin/release/commentor_macos_silicon

      - name: Upload macOS Silicon binary
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: target/aarch64-apple-darwin/release/commentor_macos_silicon
          tag: ${{ github.ref }}
          overwrite: true
          file_glob: true
