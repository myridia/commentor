name: Macos_intel
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (leave empty to skip release)'
        required: false
        type: string
  workflow_call:
    inputs:
      tag:
        description: 'Release tag from caller (leave empty to use pushed tag)'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write 
  issues: read
  packages: none

jobs:
  Build:
    runs-on: macos-15-intel

    steps:
      - name: Install Rust
        run: |
          brew install tree
          curl https://sh.rustup.rs -sSf | sh -s -- -y
          source $HOME/.cargo/env
          rustup toolchain install 1.94.1
          rustup default 1.94.1
          rustup component add llvm-tools-preview
          cargo --version 

      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile 
        run: |
          source $HOME/.cargo/env
          cargo build --release  
      - name: List
        run: |
          cd target
          tree . 
      - name: Rename
        run: |
          cp target/release/commentor commentor_macos_intel.app
          hdiutil create -volname "commentor_macos" -srcfolder "commentor_macos_intel.app" -ov -format UDZO "commentor_macos_intel.dmg"



      - name: Resolve release tag
        id: release
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="$INPUT_TAG"
          if [ -z "$tag" ] && [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          fi
          if [ -z "$tag" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "No release tag (not a tag push and no tag input); skipping release"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          fi

      - name: Release
        if: steps.release.outputs.publish == 'true'
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: 'commentor_macos_intel.dmg'
          tag: ${{ steps.release.outputs.tag }}
          overwrite: true
          file_glob: true 

    
          
