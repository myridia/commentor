name: Windows
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (leave empty to skip release)'
        required: false
        type: string
  workflow_call:
    inputs:
      tag:
        description: 'Release tag from caller (leave empty to use pushed tag)'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write 
  issues: read
  packages: none

jobs:
  Build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
          
      - name: Install Rust          
        uses: actions-rs/toolchain@v1 
        with:
          toolchain: nightly 
          target: x86_64-pc-windows-gnu 

      - name: Build
        run: |
          cargo build --release --target x86_64-pc-windows-gnu 
          cd target/x86_64-pc-windows-gnu/release/
          dir 
           
      - name: Resolve release tag
        id: release
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="$INPUT_TAG"
          if [ -z "$tag" ] && [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          fi
          if [ -z "$tag" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "No release tag (not a tag push and no tag input); skipping release"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          fi

      - name: Release
        if: steps.release.outputs.publish == 'true'
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: 'target/x86_64-pc-windows-gnu/release/commentor.exe'
          tag: ${{ steps.release.outputs.tag }}
          overwrite: true
          file_glob: true



          

          


    
   


        


        


 
     
