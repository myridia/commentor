name: Build Linux/Windows Release

on:
  push:
    branches: ["main"]
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: read
  packages: none

jobs:
  build_linux_windows:
    if: github.repository_owner == 'myridia'
    runs-on: ubuntu-22.04
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl build-essential gcc make mingw-w64 g++ zlib1g-dev libmpc-dev libmpfr-dev libgmp-dev

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Add targets
        run: |
          rustup target add x86_64-pc-windows-gnu
          rustup target add x86_64-unknown-linux-gnu

      - name: Compile Windows
        run: cargo build --target x86_64-pc-windows-gnu --release

      - name: Compile Linux
        run: cargo build --target x86_64-unknown-linux-gnu --release

      - name: Rename binaries
        run: |
          cp target/x86_64-unknown-linux-gnu/release/commentor target/x86_64-unknown-linux-gnu/release/commentor_linux
          cp target/x86_64-pc-windows-gnu/release/commentor.exe target/x86_64-pc-windows-gnu/release/commentor_windows.exe

      - name: Upload Linux binary
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: target/x86_64-unknown-linux-gnu/release/commentor_linux
          tag: ${{ github.ref }}
          overwrite: true
          file_glob: true

      - name: Upload Windows binary
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: target/x86_64-pc-windows-gnu/release/commentor_windows.exe
          tag: ${{ github.ref }}
          overwrite: true
          file_glob: true
