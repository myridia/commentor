name: FreeBSD
on:
  # workflow_run:
  #   workflows: ["Linux"]
  #   types:
  #     - completed
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (leave empty to skip release)'
        required: false
        type: string
  workflow_call:
    inputs:
      tag:
        description: 'Release tag from caller (leave empty to use pushed tag)'
        required: false
        type: string
permissions:
  contents: write
  pull-requests: write 
  issues: read
  packages: none

jobs:
  build_freebsd:
    runs-on: ubuntu-22.04
    name: A job to run FreeBSD
    env:
      MYTOKEN : ${{ secrets.MYTOKEN }}
      MYTOKEN2: "value2"
    steps:
    - uses: actions/checkout@v4
    - name: VM FreeBSD
      id: freebsd_id
      uses: vmactions/freebsd-vm@v1
      with:
        envs: 'MYTOKEN MYTOKEN2'
        usesh: true
        prepare: |
          pkg install -y curl 
          pkg install -y cmake 
          
        run: |
          curl https://sh.rustup.rs -sSf | sh -s -- -y
          . "$HOME/.cargo/env"
          rustup target list
          rustup target add x86_64-unknown-freebsd
          cargo build --release --target x86_64-unknown-freebsd
          ls target/x86_64-unknown-freebsd/release
          cp target/x86_64-unknown-freebsd/release/commentor target/x86_64-unknown-freebsd/release/commentor_freebsd
          #ls target/x86_64-unknown-freebsd/release -all

          
    - name: Resolve release tag
      id: release
      shell: bash
      env:
        INPUT_TAG: ${{ inputs.tag }}
      run: |
        tag="$INPUT_TAG"
        if [ -z "$tag" ] && [[ "$GITHUB_REF" == refs/tags/* ]]; then
          tag="${GITHUB_REF#refs/tags/}"
        fi
        if [ -z "$tag" ]; then
          echo "publish=false" >> "$GITHUB_OUTPUT"
          echo "No release tag (not a tag push and no tag input); skipping release"
        else
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
        fi

    - name: Upload freeBSD Binary to release
      if: steps.release.outputs.publish == 'true'
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: target/x86_64-unknown-freebsd/release/commentor_freebsd
        tag: ${{ steps.release.outputs.tag }}
        overwrite: true
        file_glob: true

          

          

          
