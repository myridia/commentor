name: Msix
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (leave empty to skip release)'
        required: false
        type: string
  workflow_call:
    inputs:
      tag:
        description: 'Release tag from caller (leave empty to use pushed tag)'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write 
  issues: read
  packages: none
  
jobs:
  build-msix:
    runs-on: windows-latest 

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Dependencies
        run: |
           # winget install --id Microsoft.MSIXPackagingTool -e --accept-source-agreements --accept-package-agreements --silent
           winget install microsoft.winappcli --source winget 

      - name: Download_exe 
        run: |
         curl -L "https://github.com/veto8/commentor/releases/download/main/commentor.exe" -o "./commentor.exe"
         
      - name: Certificate 
        run: |
          # $folder = "C:\Program Files (x86)\Windows Kits\10\bin\10.0.26100.0\x64\"
          # $currentPath = $env:Path
          # $env:Path = "$folder;$currentPath"
          $pass = ConvertTo-SecureString "passpass" -AsPlainText -Force
          $loc = "Cert:\CurrentUser\My"
          # $cert = New-SelfSignedCertificate -Subject "CN=Myridia" -CertStoreLocation $loc -KeyExportPolicy Exportable -KeyUsage DigitalSignature -FriendlyName "Myridia Certificate"
            $cert = New-SelfSignedCertificate -Subject "CN=Myridia" -CertStoreLocation $loc -KeyExportPolicy Exportable -KeyUsage CertSign,CrlSign -FriendlyName "Myridia Root CA"
          if ($cert) {
            $certp = "Cert:\CurrentUser\My\$($cert.Thumbprint)"
            Export-PfxCertificate  -cert $certp  -FilePath ".\Myridia.pfx" -Password $pass -Force
            Export-Certificate -Cert "Cert:\CurrentUser\My\$($cert.Thumbprint)" -FilePath ".\Myridia.cer" -Force 
            certutil -addstore Root ".\Myridia.cer"

          } else {
            Write-Error "Certificate generation failed."
          }

          $caCert = Get-ChildItem -Path $loc | Where-Object { $_.Subject -eq "CN=Myridia" }
          $cert = New-SelfSignedCertificate  -Signer $caCert -Subject "CN=Commentor" -CertStoreLocation $loc -KeyExportPolicy Exportable -KeyUsage DigitalSignature -FriendlyName "Commentor Certificate" -Type CodeSigningCert
          if ($cert) {
            $certp = "Cert:\CurrentUser\My\$($cert.Thumbprint)"
            Export-PfxCertificate  -cert $certp  -FilePath ".\Commentor.pfx" -Password $pass -Force
            Export-Certificate -Cert "Cert:\CurrentUser\My\$($cert.Thumbprint)" -FilePath ".\Commentor.cer" -Force 
            certutil -addstore Root ".\Myridia.cer"
          } else {
            Write-Error "Certificate generation failed."  
          }

      - name: Sign  
        run: |
          dir
          $cert2 = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2(".\Commentor.pfx", "passpass")
          Set-AuthenticodeSignature -FilePath ".\commentor.exe" -Certificate $cert2
          
      - name: Packing  
        run: |    
          # msixpw package --applicationFile "commentor.exe"  --fileType "EXE"  --packageName "Commentor"  --packageVersion "1.0.0"  --publisher "CN=Commentor"  --publisherDisplayName "Commentor" --outDir ".\AppPackages"  --sign  --certificatePath "Commentor.pfx"  --password "passpass"  --targetPlatforms "x64"   
          # MsixPackagingTool.exe create-package --template template.xml
          # winapp manifest generate
          # cat Package.appxmanifest 
          # winapp pack . --cert Commentor.pfx
          dir 
          mkdir app 
          cp commentor.exe app\
          cd app 
          winapp manifest generate --executable .\commentor.exe  --package-name "Commentor" --publisher-name "Commentor"
          winapp pack . --cert "..\Commentor.pfx" --cert-password "passpass" --output "commentor.msix" --name "Commentor"
          dir 
       
      - name: Resolve release tag
        id: release
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="$INPUT_TAG"
          if [ -z "$tag" ] && [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          fi
          if [ -z "$tag" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "No release tag (not a tag push and no tag input); skipping release"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          fi

      - name: Release
        if: steps.release.outputs.publish == 'true'
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: |
            app/commentor.msix  
          tag: ${{ steps.release.outputs.tag }}
          overwrite: true
          file_glob: true

      - name: Release_cert
        if: steps.release.outputs.publish == 'true'
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: |
            Myridia.cer
          tag: ${{ steps.release.outputs.tag }}
          overwrite: true
          file_glob: true

      - name: Release_cert2
        if: steps.release.outputs.publish == 'true'
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: |
            Commentor.cer
          tag: ${{ steps.release.outputs.tag }}
          overwrite: true
          file_glob: true

      - name: Release_cert3
        if: steps.release.outputs.publish == 'true'
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: |
            Commentor.pfx
          tag: ${{ steps.release.outputs.tag }}
          overwrite: true
          file_glob: true
 
