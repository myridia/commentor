name: Build FreeBSD Release

on:
  push:
    branches: ["main"]
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: read
  packages: none

jobs:
  build_freebsd:
    if: github.repository_owner == 'myridia'
    runs-on: ubuntu-22.04
    name: Build commentor on FreeBSD
    steps:
      - uses: actions/checkout@v4

      - name: VM FreeBSD
        id: freebsd_id
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: |
            pkg install -y curl
          run: |
            curl https://sh.rustup.rs -sSf | sh -s -- -y
            . "$HOME/.cargo/env"
            rustup target list
            rustup target add x86_64-unknown-freebsd
            cargo build --target x86_64-unknown-freebsd --release
            ls target/x86_64-unknown-freebsd/release
            cp target/x86_64-unknown-freebsd/release/commentor target/x86_64-unknown-freebsd/release/commentor_freebsd

      - name: Upload FreeBSD binary
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: target/x86_64-unknown-freebsd/release/commentor_freebsd
          tag: ${{ github.ref }}
          overwrite: true
          file_glob: true
